<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise shorts</title>
<style>
  :root { --bg: #fbfbfa; --fg: #1d1d1f; --muted: #5f6368; --rule: #dadce0; --link: #1a5fb4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #e8e8ea; --muted: #a0a3a8; --rule: #33363b; --link: #8ab4f8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .course { color: var(--muted); margin: 0 0 16px; }
  h2 { font-size: 1.2rem; margin: 48px 0 8px; padding-top: 12px; border-top: 1px solid var(--rule); }
  h3 { font-size: 1rem; font-weight: 600; margin: 24px 0 8px; }
  h3 a { color: var(--muted); text-decoration: none; margin-right: 6px; }
  a { color: var(--link); }
  video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
</style>
</head>
<body>
<main>
  <h1>Exercise shorts</h1>
  <p class="course"><a href="https://github.com/joselado/Advanced_Computational_Methods_Physics_2026">Advanced Computational Methods in Physics 2026: Quantum many body and tensor networks</a></p>
  <p>Short silent films with captions, four per session, where in one to two minutes we see one idea of the session, with every number on screen computed with the same codes as the notebooks</p>

</main>
</body>
</html>
